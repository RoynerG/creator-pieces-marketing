name: Instalador y actualización de Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Versión única para cada compilación
        shell: pwsh
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version
      - run: npm test
      - name: Compilar y publicar instalador y metadatos de actualización
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
